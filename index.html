  <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Path Now · No tienes que caminar solo</title>
<style>
  :root{
    --sage:#7a9e7e;
    --sage-dark:#4a6b52;
    --sage-deep:#2f4a37;
    --ink-deep:#23322a;
    --cream:#faf8f3;
    --paper:#ffffff;
    --ink:#2b2b26;
    --ink-soft:#66685f;
    --line:rgba(47,74,55,0.12);
    --radius:16px;
    --shadow:0 20px 45px -22px rgba(47,74,55,0.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.6;
  }
  h1,h2,h3{font-family:Georgia,'Iowan Old Style',serif;font-weight:400;color:var(--sage-deep);}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px;}
  section{padding:88px 0;}
  .eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-dark);font-weight:600;margin-bottom:12px;display:block;}

  .es,.en,.pt{display:none;}
  body.lang-es .es{display:inline;}
  body.lang-en .en{display:inline;}
  body.lang-pt .pt{display:inline;}
  span.es,span.en,span.pt{display:none;}
  body.lang-es span.es{display:inline;}
  body.lang-en span.en{display:inline;}
  body.lang-pt span.pt{display:inline;}
  div.es,div.en,div.pt{display:none;}
  body.lang-es div.es{display:block;}
  body.lang-en div.en{display:block;}
  body.lang-pt div.pt{display:block;}

  header.nav{position:sticky;top:0;z-index:60;background:rgba(250,248,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .nav-inner{max-width:1120px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{width:70px;height:70px;border-radius:50%;}
  .brand .name{font-family:Georgia,serif;font-size:1.15rem;color:var(--sage-deep);line-height:1.1;}
  .brand .tagline{font-size:.68rem;color:var(--ink-soft);}
  nav.links ul{display:flex;gap:26px;list-style:none;font-size:.9rem;color:var(--ink-soft);}
  nav.links a:hover{color:var(--sage-deep);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .lang-custom{position:relative;}
  .lang-btn{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--paper);cursor:pointer;font-family:inherit;color:var(--ink);display:flex;align-items:center;gap:4px;}
  .lang-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);overflow:hidden;z-index:200;min-width:96px;}
  .lang-menu.open{display:block;}
  .lang-menu button{display:block;width:100%;padding:9px 16px;border:none;background:none;cursor:pointer;font-size:.85rem;text-align:left;font-family:inherit;color:var(--ink);}
  .lang-menu button:hover{background:var(--cream);}
  .btn{font-size:.88rem;font-weight:600;padding:11px 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid transparent;transition:transform .15s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-dark{background:var(--ink-deep);color:#fff;}
  .btn-sage{background:var(--sage);color:#fff;}
  .btn-outline{background:transparent;border-color:var(--sage-deep);color:var(--sage-deep);}
  @media(max-width:900px){nav.links{display:none;}}

  .hero{position:relative;min-height:88vh;display:flex;align-items:center;color:#fff;text-align:left;}
  .hero-bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(35,50,42,.35),rgba(35,50,42,.75)),url('https://www.yourpathnow.org/hero.jpg') center/cover no-repeat;}
  .hero-inner{position:relative;z-index:2;max-width:640px;padding:0 28px;}
  .hero h1{color:#fff;font-size:clamp(2.3rem,5vw,3.4rem);line-height:1.12;margin-bottom:18px;}
  .hero h1 em{font-style:italic;color:#e7d9b8;}
  .hero p{font-size:1.08rem;color:rgba(255,255,255,.92);max-width:500px;margin-bottom:28px;}
  .hero-trust{margin-top:22px;font-size:.82rem;color:rgba(255,255,255,.8);display:flex;gap:18px;flex-wrap:wrap;}

  .quees{background:var(--paper);}
  .quees-head{max-width:640px;margin-bottom:44px;}
  .quees-head h2{font-size:2rem;}
  .quees-head p{color:var(--ink-soft);margin-top:14px;font-size:1.02rem;}
  .principios{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .principio{text-align:center;padding:26px 16px;border:1px solid var(--line);border-radius:var(--radius);}
  .principio .icon{font-size:1.6rem;margin-bottom:10px;}
  .principio h4{font-size:.98rem;color:var(--sage-deep);margin-bottom:6px;}
  .principio p{font-size:.85rem;color:var(--ink-soft);}
  @media(max-width:820px){.principios{grid-template-columns:1fr 1fr;}}

  .ayuda-head{text-align:center;max-width:600px;margin:0 auto 48px;}
  .ayuda-head h2{font-size:2rem;}
  .ayuda-head p{color:var(--ink-soft);margin-top:12px;}
  .ayuda-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .ayuda-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:30px 26px;transition:box-shadow .2s ease;cursor:pointer;text-align:left;font-family:inherit;}
  .ayuda-card:hover{box-shadow:var(--shadow);}
  .ayuda-card .icon{width:42px;height:42px;border-radius:12px;background:rgba(122,158,126,.15);display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin-bottom:16px;}
  .ayuda-card h3{font-size:1.08rem;margin-bottom:8px;}
  .ayuda-card p{font-size:.9rem;color:var(--ink-soft);margin-bottom:16px;}
  .ayuda-card .go{font-size:.85rem;color:var(--sage-dark);font-weight:600;}
  @media(max-width:900px){.ayuda-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.ayuda-grid{grid-template-columns:1fr;}}

  .funciona{background:var(--paper);}
  .funciona-head{text-align:center;margin-bottom:50px;}
  .funciona-head h2{font-size:2rem;}
  .pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;position:relative;}
  .paso{text-align:center;}
  .paso .num{width:46px;height:46px;border-radius:50%;background:var(--sage-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;margin:0 auto 14px;}
  .paso h4{font-size:1.05rem;margin-bottom:6px;}
  .paso p{font-size:.9rem;color:var(--ink-soft);}
  @media(max-width:820px){.pasos{grid-template-columns:1fr;}}

  .red{max-width:760px;margin:0 auto;text-align:center;}
  .red h2{font-size:1.9rem;margin-bottom:16px;}
  .red .eyebrow{text-align:center;}
  .red p{color:var(--ink-soft);margin-bottom:20px;}
  .red-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;max-width:520px;margin-left:auto;margin-right:auto;}
  .red-list li{font-size:.9rem;color:var(--ink);display:flex;align-items:center;gap:8px;justify-content:center;}
  @media(max-width:820px){.red-list{grid-template-columns:1fr;}}

  .confianza{background:var(--paper);}
  .confianza-head{text-align:center;margin-bottom:44px;}
  .confianza-head h2{font-size:2rem;}
  .confianza-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;}
  .confianza-item{text-align:center;padding:20px 12px;}
  .confianza-item .icon{font-size:1.5rem;margin-bottom:10px;}
  .confianza-item h4{font-size:.92rem;margin-bottom:6px;}
  .confianza-item p{font-size:.8rem;color:var(--ink-soft);}
  @media(max-width:900px){.confianza-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.confianza-grid{grid-template-columns:1fr;}}

  .palabras-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;flex-wrap:wrap;gap:16px;}
  .palabras-head h2{font-size:2rem;}
  .palabras-head p{color:var(--ink-soft);margin-top:10px;max-width:480px;}
  .palabras-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .palabra-card{background:var(--paper);border-radius:var(--radius);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px;}
  .palabra-card .ph{width:40px;height:40px;border-radius:10px;background:rgba(122,158,126,.15);display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
  .palabra-card h4{font-size:.92rem;color:var(--sage-deep);}
  .palabra-card p{font-size:.82rem;color:var(--ink-soft);}
  @media(max-width:900px){.palabras-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:560px){.palabras-grid{grid-template-columns:1fr;}}

  .historias{background:var(--paper);}
  .historias-head{text-align:center;margin-bottom:48px;}
  .historias-head h2{font-size:2rem;}
  .historias-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  .historia-card{border:1px solid var(--line);border-radius:var(--radius);padding:30px;}
  .historia-card img{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:16px;}
  .historia-card h4{color:var(--sage-deep);margin-bottom:2px;}
  .historia-card .role{font-size:.82rem;color:var(--ink-soft);margin-bottom:14px;}
  .historia-card p{font-size:.92rem;color:var(--ink-soft);margin-bottom:10px;}
  @media(max-width:820px){.historias-grid{grid-template-columns:1fr;}}

  .donar{background:var(--sage-deep);color:#fff;border-radius:var(--radius);padding:56px 44px;text-align:center;}
  .donar h2{color:#fff;font-size:1.8rem;margin-bottom:12px;}
  .donar p{color:rgba(255,255,255,.85);max-width:520px;margin:0 auto 24px;}

  .privacidad{background:var(--paper);}
  .privacidad-inner{max-width:760px;margin:0 auto;}
  .privacidad-inner h2{font-size:2rem;margin-bottom:10px;}
  .privacidad-inner .lead{color:var(--ink-soft);margin-bottom:28px;}
  .privacidad-block{margin-bottom:22px;}
  .privacidad-block h4{color:var(--sage-deep);font-size:1rem;margin-bottom:6px;}
  .privacidad-block p{color:var(--ink-soft);font-size:.95rem;line-height:1.75;}
  .privacidad-block a{color:var(--sage-dark);font-weight:600;}

  .invitacion{background:var(--ink-deep);color:#fff;}
  .invitacion-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px;}
  .invitacion h2{color:#fff;font-size:1.7rem;}
  .invitacion p{color:rgba(255,255,255,.75);margin-top:6px;}

  footer{background:var(--ink-deep);color:rgba(255,255,255,.8);padding-top:0;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding:56px 0 30px;}
  footer h5{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);margin-bottom:14px;}
  footer ul{list-style:none;font-size:.88rem;}
  footer ul li{margin-bottom:8px;}
  footer a:hover{color:#fff;}
  .foot-bottom{border-top:1px solid rgba(255,255,255,.12);padding:20px 28px;font-size:.8rem;text-align:center;color:rgba(255,255,255,.55);}
  .foot-bottom a{color:rgba(255,255,255,.75);font-weight:600;}
  .foot-bottom a:hover{color:#fff;}
  @media(max-width:820px){.footer-grid{grid-template-columns:1fr 1fr;}}

  .float-chat{position:fixed;bottom:24px;right:20px;z-index:1500;background:var(--sage);color:#fff;border:none;border-radius:50px;padding:12px 26px 12px 12px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 26px rgba(122,158,126,0.5);display:flex;align-items:center;gap:12px;}
  .float-chat img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.55);}
  @media(max-width:480px){.float-chat{padding:8px 18px 8px 8px;font-size:14px;bottom:18px;right:16px;}}

  .chat-overlay{position:fixed;inset:0;background:rgba(35,50,42,0.5);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:flex-end;justify-content:center;}
  .chat-overlay.open{display:flex;}
  .chat-modal{background:var(--cream);width:100%;max-width:560px;height:88svh;max-height:780px;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -12px 48px rgba(0,0,0,0.15);}
  .chat-header{background:var(--ink-deep);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .chat-header-info{display:flex;align-items:center;gap:12px;}
  .chat-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;}
  .chat-avatar img{width:100%;height:100%;object-fit:cover;}
  .chat-header h3{font-family:Georgia,serif;font-size:19px;font-weight:700;color:#e7d9b8;}
  .chat-header p{font-size:12px;opacity:0.85;}
  .close-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:0.8;padding:4px 8px;}
  .close-btn:hover{opacity:1;}
  .chat-messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;}
  .chat-input-area{flex-shrink:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;gap:10px;align-items:flex-end;}
  .chat-input-area textarea{flex:1;background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-family:inherit;font-size:15px;resize:none;outline:none;min-height:42px;max-height:100px;color:var(--ink);}
  .chat-input-area textarea:focus{border-color:var(--sage);}
  .chat-send{background:var(--sage);border:none;border-radius:14px;width:44px;height:44px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chat-send:hover{background:var(--sage-dark);}
  .chat-send:disabled{background:var(--line);cursor:not-allowed;}
  .chat-msg{display:flex;flex-direction:column;max-width:82%;}
  .chat-msg.user{align-self:flex-end;align-items:flex-end;}
  .chat-msg.bot{align-self:flex-start;align-items:flex-start;}
  .chat-bubble{padding:12px 17px;border-radius:20px;font-size:15px;line-height:1.65;}
  .chat-msg.user .chat-bubble{background:var(--sage);color:#fff;border-bottom-right-radius:4px;}
  .chat-msg.bot .chat-bubble{background:var(--paper);border:1px solid var(--line);font-family:Georgia,serif;font-size:16px;border-bottom-left-radius:4px;color:var(--ink);}
  .typing-dots{display:flex;gap:5px;align-items:center;padding:14px 16px;}
  .typing-dots span{width:7px;height:7px;background:var(--sage);border-radius:50%;animation:td 1.2s ease-in-out infinite;opacity:0.5;}
  .typing-dots span:nth-child(2){animation-delay:.2s;}
  .typing-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes td{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-6px);opacity:1;}}

  .reg-overlay{position:fixed;inset:0;background:rgba(35,50,42,0.5);backdrop-filter:blur(4px);z-index:2100;display:none;align-items:center;justify-content:center;padding:20px;}
  .reg-overlay.open{display:flex;}
  .reg-modal{background:var(--cream);width:100%;max-width:400px;border-radius:28px;padding:36px 30px;box-shadow:0 20px 60px rgba(0,0,0,0.28);text-align:center;position:relative;}
  .reg-modal .chat-avatar{width:58px;height:58px;margin:0 auto 16px;}
  .reg-modal h3{font-size:23px;margin-bottom:8px;}
  .reg-sub{color:var(--ink-soft);font-size:14.5px;margin-bottom:22px;line-height:1.6;}
  .reg-field{text-align:left;margin-bottom:14px;}
  .reg-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .reg-field input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-family:inherit;font-size:15px;color:var(--ink);outline:none;}
  .reg-field input:focus{border-color:var(--sage);}
  .reg-error{color:#b5564f;font-size:13px;margin:-4px 0 12px;display:none;text-align:left;}
  .reg-error.show{display:block;}
  .reg-submit{width:100%;background:var(--sage);color:#fff;border:none;border-radius:50px;padding:13px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;}
  .reg-submit:hover{background:var(--sage-dark);}
  .reg-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;}
  .reg-privacy-note{font-size:11.5px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}
  .reg-privacy-note a{color:var(--sage-dark);}
  .cat-skip{margin-top:16px;font-size:13px;color:var(--ink-soft);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit;}

  .cat-overlay{position:fixed;inset:0;background:rgba(35,50,42,0.5);backdrop-filter:blur(4px);z-index:2150;display:none;align-items:center;justify-content:center;padding:20px;}
  .cat-overlay.open{display:flex;}
  .cat-modal{background:var(--cream);width:100%;max-width:440px;max-height:88svh;overflow-y:auto;border-radius:28px;padding:32px 26px;box-shadow:0 20px 60px rgba(0,0,0,0.28);text-align:center;}
  .cat-modal .chat-avatar{width:52px;height:52px;margin:0 auto 14px;}
  .cat-modal h3{font-size:21px;margin-bottom:6px;line-height:1.3;}
  .cat-sub{color:var(--ink-soft);font-size:14px;margin-bottom:20px;}
  .cat-list{display:flex;flex-direction:column;gap:8px;}
  .cat-item{display:flex;align-items:center;gap:12px;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;text-align:left;font-family:inherit;font-size:14.5px;color:var(--ink);}
  .cat-item:hover{border-color:var(--sage);background:rgba(122,158,126,.08);}
  .cat-item .cic{font-size:18px;flex-shrink:0;}
  .cat-item .clabel{flex:1;}
  .cat-item .carrow{color:var(--sage);font-size:15px;}

  .crisis-banner{background:#fff4ec;border:1.5px solid #e6b89c;border-radius:16px;padding:14px 16px;margin:2px 0 6px;display:flex;gap:12px;align-items:flex-start;}
  .crisis-banner .cb-ic{font-size:20px;flex-shrink:0;}
  .crisis-banner .cb-body{flex:1;}
  .crisis-banner .cb-title{font-family:Georgia,serif;font-size:15px;font-weight:700;color:#8a3a1a;margin-bottom:3px;}
  .crisis-banner .cb-text{font-size:13px;color:#7a4a30;line-height:1.55;margin-bottom:9px;}
  .crisis-banner .cb-btn{display:inline-flex;align-items:center;gap:6px;background:#c9553a;color:#fff;border:none;border-radius:30px;padding:9px 18px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;}
  .crisis-banner .cb-btn:hover{background:#a8442e;}

  .crisis-overlay{position:fixed;inset:0;background:rgba(30,15,10,0.6);backdrop-filter:blur(5px);z-index:2300;display:none;align-items:center;justify-content:center;padding:20px;}
  .crisis-overlay.open{display:flex;}
  .crisis-modal{background:#fffaf6;width:100%;max-width:460px;max-height:90svh;overflow-y:auto;border-radius:26px;padding:30px 26px;box-shadow:0 20px 60px rgba(0,0,0,0.32);position:relative;}
  .crisis-modal h3{font-size:22px;color:#8a3a1a;margin-bottom:8px;line-height:1.3;}
  .crisis-modal .cm-lead{font-size:14.5px;color:#6a4535;line-height:1.65;margin-bottom:20px;}
  .crisis-country-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .crisis-country-btn{background:#fff;border:1.5px solid #e6b89c;border-radius:30px;padding:7px 15px;font-family:inherit;font-size:13px;font-weight:700;color:#8a3a1a;cursor:pointer;}
  .crisis-country-btn.active{background:#c9553a;color:#fff;border-color:#c9553a;}
  .crisis-res{background:#fff;border:1px solid #eed9c9;border-radius:14px;padding:16px 18px;margin-bottom:10px;}
  .crisis-res .cr-name{font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:2px;}
  .crisis-res .cr-num{font-family:Georgia,serif;font-size:22px;font-weight:700;color:#c9553a;margin:2px 0;}
  .crisis-res .cr-num a{color:#c9553a;text-decoration:none;}
  .crisis-res .cr-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .crisis-res .cr-call{display:inline-block;margin-top:8px;background:#c9553a;color:#fff;border-radius:30px;padding:8px 18px;font-size:13px;font-weight:700;text-decoration:none;}
  .crisis-global{text-align:center;margin-top:8px;font-size:13px;color:var(--ink-soft);}
